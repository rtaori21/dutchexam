[project]
name = "job-finder-backend"
version = "0.1.0"
description = "Continuous job scraper, matcher, and auto-applier for the Netherlands tech market"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-jobspy>=1.1.80",
    "apscheduler>=3.10",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "playwright>=1.49",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
